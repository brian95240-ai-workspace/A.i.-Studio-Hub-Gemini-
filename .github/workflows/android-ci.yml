name: Android CI

# Runs the JVM unit tests, a debug build, and an R8-minified release build on every push to
# main, on every pull request, and on demand. The release build is signed with a throwaway
# key generated inside the job, so it only proves the release variant compiles, minifies and
# packages. That APK is never uploaded and must never be distributed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_VERSION: "9.3.1"  # keep in step with gradle/wrapper/gradle-wrapper.properties
      COMPILE_PLATFORM: "platforms;android-36.1"  # app/build.gradle.kts: compileSdk release(36) minorApiLevel 1

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (the repo has no gradlew script, so use the pinned distribution)
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Android SDK licenses and compile platform
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          if ! "$SDKMANAGER" "$COMPILE_PLATFORM" > /dev/null; then
            echo "::warning::Could not pre-install $COMPILE_PLATFORM; the Android Gradle Plugin will try to download it."
          fi

      - name: Create the debug keystore expected by build.gradle.kts (CI only, git-ignored)
        shell: bash
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" > /dev/null 2>&1

      - name: Unit tests (debug, JVM + Robolectric)
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Debug build
        if: ${{ !cancelled() }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Release build (R8) with a throwaway signing key
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="${RUNNER_TEMP}/ci-throwaway-upload.jks"
          STORE_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::${STORE_PASSWORD}"
          keytool -genkeypair -keystore "$KEYSTORE_PATH" -storetype PKCS12 \
            -storepass "$STORE_PASSWORD" -keypass "$STORE_PASSWORD" \
            -alias upload -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=CI throwaway, O=Not for distribution" > /dev/null 2>&1
          export KEYSTORE_PATH STORE_PASSWORD
          export KEY_PASSWORD="$STORE_PASSWORD"
          gradle --no-daemon --stacktrace :app:assembleRelease
          rm -f "$KEYSTORE_PATH"

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14
